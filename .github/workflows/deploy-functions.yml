name: Deploy Supabase Edge Function
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/deploy-functions.yml"]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check token
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then echo "Chưa có secret SUPABASE_ACCESS_TOKEN"; exit 1; fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy function "account"
        run: supabase functions deploy account --project-ref xwkrilmepffdhdrhmugh --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
