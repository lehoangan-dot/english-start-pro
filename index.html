<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Start Pro</title>
<meta name="description" content="Học tiếng Anh từ số 0 đến B1 cho người Việt: 30 bài học, 1.449 từ vựng có phát âm, luyện nghe, luyện nói, ôn tập thông minh. Miễn phí.">
<meta name="theme-color" content="#1e5eff">

<meta property="og:title" content="English Start Pro – Học tiếng Anh từ số 0">
<meta property="og:description" content="Lộ trình 5 cấp độ đến B1, giải thích bằng tiếng Việt. Miễn phí, không cần đăng ký.">

<style>
:root{
  --blue:#1e5eff;--blue-d:#1747c4;--blue-l:#e8efff;--blue-xl:#f4f7ff;
  --ink:#16213a;--muted:#5d6782;--line:#e2e7f2;--bg:#f6f8fc;--card:#fff;
  --ok:#14945a;--ok-l:#e5f6ee;--bad:#d23b3b;--bad-l:#fdecec;--warn:#b7791f;--warn-l:#fdf4e3;
  --r:14px;--sh:0 1px 2px rgba(20,40,90,.06),0 4px 16px rgba(20,40,90,.06);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.5rem}h2{font-size:1.2rem}h3{font-size:1.05rem}
p{margin:.4em 0}
.app{display:flex;min-height:100vh}
/* sidebar */
.side{width:232px;background:#fff;border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;font-weight:800;letter-spacing:.2px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px;letter-spacing:0}
.nav a{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:15px;margin-bottom:2px}
.nav a:hover{background:var(--blue-xl)}
.nav a.on{background:var(--blue-l);color:var(--blue-d);font-weight:650}
.nav .ic{width:22px;text-align:center}
.nav .tag{margin-left:auto;font-size:10.5px;background:#eef0f5;color:var(--muted);padding:1px 6px;border-radius:6px}
.main{flex:1;min-width:0;padding:24px 28px 40px;max-width:980px}
.topbar{display:none}
.bnav{display:none}
@media (max-width:820px){
  .side{display:none}
  .main{padding:14px 14px 96px}
  .topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .topbar .brand{padding:0;font-size:15px}
  .bnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:30;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  .bnav a{flex:1;text-align:center;font-size:11px;color:var(--muted);text-decoration:none;padding:4px 0}
  .bnav a .ic{display:block;font-size:20px;line-height:1.2}
  .bnav a.on{color:var(--blue);font-weight:650}
}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:18px;margin-bottom:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:820px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.g2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;background:var(--blue);color:#fff;font-weight:650;min-height:44px}
.btn:hover{background:var(--blue-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.big{font-size:1.05rem;padding:14px 26px;width:100%}
.btn.ghost{background:var(--blue-l);color:var(--blue-d)}
.btn.ghost:hover{background:#dbe6ff}
.btn.line{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn.danger{background:var(--bad)}
.btn.sm{padding:7px 12px;min-height:36px;font-size:14px;border-radius:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.muted{color:var(--muted)}
.small{font-size:14px}
.xs{font-size:12.5px}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--blue-l);color:var(--blue-d)}
.pill.ok{background:var(--ok-l);color:var(--ok)}
.pill.warn{background:var(--warn-l);color:var(--warn)}
.pill.gray{background:#eef0f5;color:var(--muted)}
.bar{height:10px;background:#e9edf6;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--blue);border-radius:99px;transition:width .4s}
.bar.ok>i{background:var(--ok)}
.hero{background:linear-gradient(135deg,#1e5eff,#3b82f6);color:#fff}
.hero .muted{color:#dbe6ff}
.hero .bar{background:rgba(255,255,255,.25)}
.hero .bar>i{background:#fff}
.stat b{display:block;font-size:1.6rem;line-height:1.1}
.stat span{font-size:13px;color:var(--muted)}
.notice{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--warn-l);color:#6b4a12;margin-bottom:14px}
.notice.info{background:var(--blue-xl);color:#20366e;border:1px solid var(--blue-l)}
.notice.ok{background:var(--ok-l);color:#0d5c39}
.lvl{border:1.5px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:14px;overflow:hidden}
.lvl-h{padding:14px 16px;display:flex;gap:12px;align-items:center}
.lvl-n{width:42px;height:42px;border-radius:12px;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.lvl.lock .lvl-n{background:#c4cbdb}
.lesson{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.lesson:hover:not(:disabled){background:var(--blue-xl)}
.lesson:disabled{opacity:.55;cursor:not-allowed}
.lesson .st{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:14px;background:#eef0f5;flex-shrink:0}
.lesson .st.done{background:var(--ok);color:#fff}
.lesson .st.cur{background:var(--blue);color:#fff}
/* lesson content */
.sec{margin:18px 0}
.formula{background:var(--blue-xl);border-left:4px solid var(--blue);padding:10px 14px;border-radius:8px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:15px;margin:8px 0;white-space:pre-wrap}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{background:#f3f6fb;font-size:13px;color:var(--muted);font-weight:650}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .en{font-weight:600}
.spk{width:34px;height:34px;border-radius:50%;background:var(--blue-l);color:var(--blue-d);display:inline-grid;place-items:center;flex-shrink:0;font-size:15px}
.spk:hover{background:#d4e1ff}
.mis{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.mis .w{color:var(--bad);text-decoration:line-through}
.mis .r{color:var(--ok);font-weight:600}
.mis .why{grid-column:1/-1;color:var(--muted);font-size:14px}
.abc{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:8px}
.abc button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center}
.abc button:hover{border-color:var(--blue)}
.abc b{display:block;font-size:1.35rem}
.abc span{font-size:12px;color:var(--muted);display:block}
.abc button.vow{background:var(--blue-xl);border-color:#c9d8ff}
/* vocab */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.chip{white-space:nowrap;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:14px}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff}
.vc{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px;display:flex;gap:12px}
.vc .emo{font-size:2rem;width:48px;height:48px;display:grid;place-items:center;background:var(--blue-xl);border-radius:12px;flex-shrink:0}
.vc .w{font-weight:750;font-size:1.1rem}
.vc .ipa{color:var(--blue-d);font-size:14px}
.vc .star{font-size:20px;color:#c4cbdb}
.vc .star.on{color:#f5b301}
.vc .lrn{font-size:12px;padding:3px 8px;border-radius:8px;background:#eef0f5;color:var(--muted)}
.vc .lrn.on{background:var(--ok-l);color:var(--ok)}
/* quiz */
.qwrap{max-width:640px;margin:0 auto}
.qtype{font-size:12.5px;font-weight:700;color:var(--blue-d);text-transform:uppercase;letter-spacing:.5px}
.qtext{font-size:1.2rem;font-weight:650;margin:6px 0 16px}
.opt{display:block;width:100%;text-align:left;padding:13px 16px;border:2px solid var(--line);border-radius:12px;background:#fff;margin-bottom:10px;font-size:16px}
.opt:hover:not(:disabled){border-color:#9fb8ff}
.opt.sel{border-color:var(--blue);background:var(--blue-xl)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.inp{width:100%;padding:13px 14px;border:2px solid var(--line);border-radius:12px;font-size:17px;background:#fff}
.inp:focus{outline:none;border-color:var(--blue)}
.zone{min-height:58px;border:2px dashed #c9d3e8;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;background:#fff}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.wchip{padding:9px 14px;border-radius:10px;background:#fff;border:1.5px solid #c9d3e8;font-size:16px;font-weight:600}
.wchip.used{visibility:hidden}
.zone .wchip{background:var(--blue-l);border-color:#b9cdff}
.fb{border-radius:12px;padding:12px 14px;margin-top:14px;font-size:15px}
.fb.ok{background:var(--ok-l);color:#0d5c39}
.fb.bad{background:var(--bad-l);color:#8a1f1f}
.listen-big{width:84px;height:84px;border-radius:50%;background:var(--blue);color:#fff;font-size:34px;display:grid;place-items:center;margin:4px auto 6px}
.rate{display:flex;gap:6px;justify-content:center;margin-bottom:14px}
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.qbar .bar{flex:1}
.res-score{font-size:3rem;font-weight:800;text-align:center;line-height:1}
.wl{border-top:1px solid var(--line);padding:10px 0}
/* modal / toast */
.modal{position:fixed;inset:0;background:rgba(15,25,50,.45);display:grid;place-items:center;z-index:100;padding:16px}
.modal .box{background:#fff;border-radius:16px;padding:20px;max-width:420px;width:100%}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#16213a;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:120;max-width:90vw}
.chart{display:flex;align-items:flex-end;gap:6px;height:140px;padding-top:8px}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart .c i{display:block;width:100%;max-width:34px;background:var(--blue);border-radius:6px 6px 2px 2px;min-height:2px}
.chart .c span{font-size:11px;color:var(--muted);min-height:15px;line-height:15px}
.chart.m{gap:2px;height:100px}
.chart.m .c i{max-width:12px}
label.f{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}
.center{text-align:center}
.splash{display:grid;place-items:center;min-height:70vh;text-align:center;color:var(--muted)}
.ph{text-align:center;padding:30px 16px}
.ph .big{font-size:3rem}
ul.clean{margin:.3em 0;padding-left:1.2em}
.passage{background:#fbfcff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.65;margin-bottom:14px}
textarea.inp{font-family:inherit;resize:vertical;font-size:16px;line-height:1.5}
.bub{max-width:88%;padding:10px 13px;border-radius:14px;margin:6px 0;font-size:15px;line-height:1.55;word-wrap:break-word}
.bub.ai{background:#f1f4fa;border-top-left-radius:4px}
.bub.me{background:var(--blue);color:#fff;margin-left:auto;border-top-right-radius:4px}
.badgepop{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:130;background:linear-gradient(135deg,#1e5eff,#7c3aed);color:#fff;border-radius:14px;padding:12px 16px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(30,60,160,.35);max-width:92vw;cursor:pointer;animation:pop .35s ease}
@keyframes pop{from{transform:translate(-50%,-20px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.actbar{margin-top:16px}
@media (max-width:820px){
  body.focus .bnav{display:none}
  body.focus .main{padding-bottom:16px}
  .actbar{position:sticky;bottom:0;background:linear-gradient(rgba(255,255,255,0),#fff 22%);padding:14px 0 calc(8px + env(safe-area-inset-bottom));margin:6px -18px -18px;padding-left:18px;padding-right:18px;z-index:5}
  .opt{padding:14px 16px}
  .wchip{padding:10px 14px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom))}
}
body.authgate .side,body.authgate .bnav{display:none}
body.authgate .main{margin:0 auto}
.back{color:var(--blue-d);font-weight:600;font-size:15px;padding:6px 0;margin-bottom:6px}
</style>
</head>

<div class="topbar"><div class="brand"><div class="logo">ES</div><div>English Start Pro</div></div><div class="sp"></div><span id="tb-store" class="pill gray xs">…</span></div>

  {t:"tr",q:"Dịch sang tiếng Anh: “ngôi nhà”",a:["house","a house","home"],e:"house = ngôi nhà (home = nhà, tổ ấm – cũng chấp nhận)."},
  {t:"order",a:"This is a book.",vi:"Đây là một quyển sách.",e:"This is + a + danh từ."},
  {t:"listen",say:"This is a car.",o:["This is a cat.","This is a car.","This is a card.","This is a cup."],a:1,e:"car /kɑːr/ = xe ô tô."},
  {t:"mcq",q:"Từ nào nghĩa là “không”?",o:["yes","no","hello","pen"],a:1,e:"no = không; yes = vâng/có."}
 ]},
{id:"l0-4",level:0,title:"Chào hỏi đơn giản",grammar:false,min:12,
 goal:"Chào hỏi, hỏi thăm và tạm biệt bằng tiếng Anh.",
 sec:[
  {h:"Chào khi gặp",table:{head:["Tiếng Anh","Nghĩa","Khi nào dùng"],rows:[["Hello / Hi","Xin chào","Mọi lúc. “Hi” thân mật hơn."],["Good morning","Chào buổi sáng","Trước 12 giờ trưa"],["Good afternoon","Chào buổi chiều","12h – khoảng 18h"],["Good evening","Chào buổi tối","Sau khoảng 18h, khi gặp nhau"]]}},
  {h:"Hỏi thăm và đáp lại",ex:[["How are you?","Bạn khỏe không?"],["I'm fine, thank you. And you?","Tôi khỏe, cảm ơn. Còn bạn?"],["Nice to meet you.","Rất vui được gặp bạn."],["Nice to meet you too.","Tôi cũng rất vui được gặp bạn."]]},
  {h:"Chào khi chia tay",ex:[["Goodbye. / Bye.","Tạm biệt."],["See you later.","Hẹn gặp lại."],["See you tomorrow.","Hẹn gặp ngày mai."],["Good night.","Chúc ngủ ngon / chào khi chia tay buổi tối."]]},
  {h:"Lỗi thường gặp",mis:[["Gặp nhau lúc 8h tối nói “Good night!”","“Good evening!”","Good night chỉ dùng khi <b>chia tay</b> buổi tối hoặc đi ngủ, không dùng để chào khi gặp."],["How are you? → “I'm fine. Thank.”","“I'm fine, thank you.” / “Thanks.”","Nói “thank you” hoặc “thanks”, không nói “thank”."]]}
 ],
 exs:[
  {t:"mcq",q:"Bạn gặp đồng nghiệp lúc 9 giờ sáng. Bạn nói:",o:["Good night!","Good evening!","Good morning!","Goodbye!"],a:2,e:"Trước 12 giờ trưa dùng Good morning."},
  {t:"mcq",q:"Ai đó hỏi “How are you?”. Câu trả lời phù hợp nhất:",o:["I'm fine, thank you.","I'm 30.","Nice to meet you.","Goodbye."],a:0,e:"How are you? = Bạn khỏe không? → I'm fine, thank you."},
  {t:"fill",q:"Nice to ___ you.",a:["meet"],e:"Nice to meet you = Rất vui được gặp bạn."},
  {t:"order",a:"How are you?",vi:"Bạn khỏe không?",e:"How + are + you?"},
  {t:"tr",q:"Dịch: “Rất vui được gặp bạn.”",a:["nice to meet you","it is nice to meet you","pleased to meet you","glad to meet you"],e:"Nice to meet you."},
  {t:"listen",say:"See you later.",o:["See you later.","See you tomorrow.","Thank you.","Good night."],a:0,e:"See you later = Hẹn gặp lại."},
  {t:"mcq",q:"Câu nào dùng khi CHIA TAY buổi tối?",o:["Good evening.","Good night.","Good morning.","Hello."],a:1,e:"Good night dùng khi chia tay buổi tối hoặc đi ngủ."}
 ]},
/* ===== LEVEL 1 ===== */
{id:"l1-1",level:1,title:"Đại từ nhân xưng",grammar:true,min:12,
 goal:"Dùng đúng I, you, he, she, it, we, they.",
 sec:[
  {h:"Đại từ nhân xưng là gì?",p:"Là từ dùng để chỉ người hoặc vật, thay cho tên gọi. Trong tiếng Việt có rất nhiều cách xưng hô (anh, chị, em, cô, chú…), nhưng tiếng Anh chỉ có <b>7 từ</b> làm chủ ngữ."},
  {h:"Bảng đại từ",table:{head:["Tiếng Anh","Nghĩa","Ví dụ"],rows:[["I","tôi, mình, em, anh…","I am Nam."],["you","bạn, anh, chị, các bạn…","You are kind."],["he","anh ấy, ông ấy (nam)","He is my father."],["she","cô ấy, bà ấy (nữ)","She is a doctor."],["it","nó (đồ vật, con vật)","It is a cat."],["we","chúng tôi, chúng ta","We are friends."],["they","họ, chúng nó","They are students."]]}},
  {h:"Cách thay thế",ex:[["Mr. Hung is an engineer. → He is an engineer.","Ông Hùng là kỹ sư. → Ông ấy là kỹ sư."],["My mother is a teacher. → She is a teacher.","Mẹ tôi là giáo viên. → Bà ấy là giáo viên."],["Lan and I are friends. → We are friends.","Lan và tôi là bạn. → Chúng tôi là bạn."],["The book is new. → It is new.","Quyển sách mới. → Nó mới."]]},
  {h:"Lỗi thường gặp",mis:[["i am a student.","I am a student.","“I” luôn viết hoa, ở bất kỳ vị trí nào trong câu."],["My phone? He is new.","It is new.","Đồ vật dùng “it”, không dùng he/she."],["Lan and me are friends.","Lan and I are friends.","Làm chủ ngữ phải dùng “I”, không dùng “me”."]]}
 ],
 exs:[
  {t:"mcq",q:"“My mother” thay bằng đại từ nào?",o:["he","she","it","they"],a:1,e:"Mẹ là nữ → she."},
  {t:"mcq",q:"“The computer” thay bằng đại từ nào?",o:["he","she","it","we"],a:2,e:"Đồ vật → it."},
  {t:"fill",q:"Lan and I are friends. → ___ are friends.",a:["we"],e:"“Lan và tôi” = chúng tôi → We."},
  {t:"order",a:"They are my friends.",vi:"Họ là bạn của tôi.",e:"They (họ) + are + my friends."},
  {t:"tr",q:"Dịch: “Anh ấy là bố tôi.”",a:["he is my father","he is my dad","he's my father","he is my daddy"],e:"He is my father."},
  {t:"listen",say:"She is a doctor.",o:["He is a doctor.","She is a doctor.","She is a teacher.","We are doctors."],a:1,e:"She is a doctor = Cô ấy là bác sĩ."},
  {t:"mcq",q:"Câu nào viết ĐÚNG?",o:["i am Nam.","I am Nam.","Me am Nam.","I is Nam."],a:1,e:"“I” luôn viết hoa và đi với “am”."}
 ]},
{id:"l1-2",level:1,title:"Động từ To Be (am / is / are)",grammar:true,min:15,
 goal:"Dùng đúng am / is / are trong câu khẳng định, phủ định, nghi vấn.",
 sec:[
  {h:"To Be nghĩa là gì?",p:"To Be thường mang nghĩa <b>“là”, “thì”, “ở”</b>. Đây là động từ quan trọng nhất của tiếng Anh. Có 3 dạng ở hiện tại: <b>am, is, are</b>."},
  {h:"Công thức",formula:"I              + am\nHe / She / It  + is\nYou / We / They + are"},
  {h:"3 dạng câu",table:{head:["Dạng câu","Công thức","Ví dụ"],rows:[["Khẳng định","S + am/is/are + ...","She is a nurse."],["Phủ định","S + am/is/are + not + ...","She is not (isn't) a nurse."],["Nghi vấn","Am/Is/Are + S + ...?","Is she a nurse? – Yes, she is. / No, she isn't."]]}},
  {h:"Viết tắt",ex:[["I am → I'm","Tôi là"],["He is → He's / is not → isn't","Anh ấy là / không phải"],["They are → They're / are not → aren't","Họ là / không phải"]]},
  {h:"Ví dụ",ex:[["I am an engineer.","Tôi là kỹ sư."],["We are at the office.","Chúng tôi đang ở văn phòng."],["It is not expensive.","Nó không đắt."],["Are you tired? – Yes, I am.","Bạn mệt không? – Có, tôi mệt."]]},
  {h:"Lỗi thường gặp của người Việt",mis:[["I happy.","I am happy.","Tiếng Việt nói “Tôi vui”, nhưng tiếng Anh <b>bắt buộc</b> có to be trước tính từ."],["She are a teacher.","She is a teacher.","She đi với is."],["I is tired.","I am tired.","I chỉ đi với am."],["You are student?","Are you a student?","Câu hỏi phải đảo “are” lên trước chủ ngữ."]]}
 ],
 exs:[
  {t:"fill",q:"She ___ a doctor.",a:["is"],e:"She đi với is."},
  {t:"mcq",q:"I ___ tired today.",o:["is","are","am","be"],a:2,e:"I luôn đi với am."},
  {t:"fill",q:"They ___ not at home.",a:["are"],e:"They đi với are → They are not (aren't) at home."},
  {t:"order",a:"Is he a teacher?",vi:"Anh ấy có phải giáo viên không?",e:"Câu hỏi: Is + he + a teacher?"},
  {t:"tr",q:"Dịch: “Tôi là kỹ sư.”",a:["i am an engineer","i'm an engineer"],e:"I am an engineer. Lưu ý: engineer bắt đầu bằng nguyên âm nên dùng <b>an</b>."},
  {t:"mcq",q:"Câu nào ĐÚNG?",o:["I happy.","I am happy.","I is happy.","I are happy."],a:1,e:"Trước tính từ phải có to be: I am happy."},
  {t:"listen",say:"We are students.",o:["We are students.","They are students.","We are teachers.","You are students."],a:0,e:"We are students = Chúng tôi là học sinh."},
  {t:"mcq",q:"“Are you busy?” – trả lời ngắn khẳng định:",o:["Yes, you are.","Yes, I am.","Yes, I is.","Yes, I'm."],a:1,e:"Yes, I am. (Câu trả lời ngắn không viết tắt “I'm” ở cuối.)"}
 ]},
{id:"l1-3",level:1,title:"Mạo từ a / an / the",grammar:true,min:12,
 goal:"Chọn đúng a, an, the.",
 sec:[
  {h:"Quy tắc a / an",p:"<b>a</b> và <b>an</b> đều nghĩa là “một”, dùng với danh từ số ít, đếm được, nhắc đến lần đầu.<br>Quan trọng: chọn theo <b>ÂM đầu</b> khi đọc, không phải chữ cái đầu.",formula:"a  + âm phụ âm   → a book, a car, a university (/juː/)\nan + âm nguyên âm → an apple, an egg, an hour (h câm)"},
  {h:"Khi nào dùng the?",p:"<b>the</b> dùng khi người nghe <b>đã biết</b> mình nói về cái nào: đã nhắc trước đó, chỉ có một, hoặc đã xác định rõ.",ex:[["I have a cat. The cat is black.","Tôi có một con mèo. Con mèo (đó) màu đen."],["The sun is hot.","Mặt trời nóng. (chỉ có một mặt trời)"],["Please close the door.","Làm ơn đóng cửa (cái cửa ở đây)."]]},
  {h:"Lỗi thường gặp",mis:[["a apple","an apple","apple bắt đầu bằng âm nguyên âm /æ/."],["an university","a university","university đọc /juː/ – âm phụ âm."],["a hour","an hour","h câm, đọc /aʊ/ – âm nguyên âm."],["He is engineer.","He is an engineer.","Nói về nghề nghiệp của một người phải có a/an."]]}
 ],
 exs:[
  {t:"fill",q:"I want ___ apple.",a:["an"],e:"apple bắt đầu bằng âm nguyên âm → an."},
  {t:"mcq",q:"___ hour",o:["a","an","the","(không cần)"],a:1,e:"h câm → đọc /aʊ/ → an hour."},
  {t:"mcq",q:"___ university",o:["a","an"],a:0,e:"university đọc /ˌjuːnɪˈvɜːrsəti/, âm đầu /j/ là phụ âm → a."},
  {t:"fill",q:"I have a dog. ___ dog is very small.",a:["the"],e:"Con chó đã được nhắc ở câu trước → the."},
  {t:"order",a:"She is an engineer.",vi:"Cô ấy là một kỹ sư.",e:"engineer → an."},
  {t:"tr",q:"Dịch: “Đây là một quả trứng.”",a:["this is an egg"],e:"This is an egg. egg bắt đầu bằng âm nguyên âm → an."},
  {t:"listen",say:"an orange",o:["an orange","a orange","the orange","an origin"],a:0,e:"an orange = một quả cam."}
 ]},
{id:"l1-4",level:1,title:"Số đếm và tuổi",grammar:false,min:12,
 goal:"Đếm 0–100, nói tuổi và số điện thoại.",
 sec:[
  {h:"Số 0 – 12",words:[["zero","/ˈzɪroʊ/","0"],["one","/wʌn/","1"],["two","/tuː/","2"],["three","/θriː/","3"],["four","/fɔːr/","4"],["five","/faɪv/","5"],["six","/sɪks/","6"],["seven","/ˈsɛvən/","7"],["eight","/eɪt/","8"],["nine","/naɪn/","9"],["ten","/tɛn/","10"],["eleven","/ɪˈlɛvən/","11"],["twelve","/twɛlv/","12"]]},
  {h:"Số 13 – 19 và hàng chục",p:"13–19 thêm đuôi <b>-teen</b>: thirteen (13), fourteen, fifteen, sixteen, seventeen, eighteen, nineteen.<br>Hàng chục thêm đuôi <b>-ty</b>: twenty (20), thirty (30), forty (40 – <i>không có u</i>), fifty, sixty, seventy, eighty, ninety, one hundred (100).<br>Số ghép: 35 = thirty-five, 48 = forty-eight."},
  {h:"Nói tuổi",formula:"How old are you?     → Bạn bao nhiêu tuổi?\nI am 35 (years old). → Tôi 35 tuổi.",ex:[["How old is your daughter?","Con gái bạn bao nhiêu tuổi?"],["She is seven years old.","Cháu bảy tuổi."]]},
  {h:"Lỗi thường gặp",mis:[["thirteen ≈ thirty","thir<b>TEEN</b> /θɜːrˈtiːn/ – thir<b>ty</b> /ˈθɜːrti/","-teen nhấn ở cuối, kéo dài; -ty nhấn ở đầu."],["fourty","forty","40 viết là forty, không có chữ u."],["I have 35 years old.","I am 35 years old.","Nói tuổi dùng to be, không dùng have."]]}
 ],
 exs:[
  {t:"listen",say:"fifteen",o:["15","50","5","16"],a:0,e:"fifteen = 15 (nhấn cuối, -teen). fifty = 50."},
  {t:"mcq",q:"Số 12 là:",o:["twelve","twenty","eleven","two"],a:0,e:"12 = twelve."},
  {t:"fill",q:"How ___ are you? – I am 30.",a:["old"],e:"How old are you? = Bạn bao nhiêu tuổi?"},
  {t:"order",a:"I am forty years old.",vi:"Tôi bốn mươi tuổi.",e:"I am + số + years old."},
  {t:"tr",q:"Dịch: “Tôi 35 tuổi.”",a:["i am 35","i am 35 years old","i am thirty five","i am thirty five years old"],e:"I am thirty-five (years old)."},
  {t:"listen",say:"thirty",o:["13","30","33","3"],a:1,e:"thirty = 30, nhấn âm đầu."},
  {t:"mcq",q:"Cách viết đúng của 40:",o:["fourty","forty","fourteen","fourthy"],a:1,e:"40 = forty."}
 ]},
{id:"l1-5",level:1,title:"Thì hiện tại đơn",grammar:true,min:15,
 goal:"Nói về thói quen, công việc hằng ngày, sự thật.",
 sec:[
  {h:"Dùng khi nào?",p:"Dùng để nói về <b>thói quen</b> (I drink coffee every morning), <b>công việc thường ngày</b> (She works in an office), <b>sự thật</b> (The sun rises in the east)."},
  {h:"Công thức",formula:"(+) I/You/We/They + V            → I work.\n    He/She/It      + V-s/es        → She works.\n(-) I/You/We/They + do not (don't) + V\n    He/She/It      + does not (doesn't) + V\n(?) Do  + I/you/we/they + V ...?\n    Does + he/she/it     + V ...?"},
  {h:"Thêm s hay es?",table:{head:["Quy tắc","Ví dụ"],rows:[["Thông thường + s","work → works, like → likes"],["Tận cùng o, s, x, ch, sh + es","go → goes, watch → watches"],["Phụ âm + y → ies","study → studies"],["Đặc biệt","have → has"]]}},
  {h:"Ví dụ",ex:[["I work from Monday to Friday.","Tôi làm việc từ thứ Hai đến thứ Sáu."],["He goes to school by bus.","Cậu ấy đi học bằng xe buýt."],["She doesn't eat meat.","Cô ấy không ăn thịt."],["Do you like coffee? – Yes, I do.","Bạn thích cà phê không? – Có."]]},
  {h:"Lỗi thường gặp",mis:[["He go to work.","He goes to work.","He/She/It phải thêm s/es."],["She doesn't works.","She doesn't work.","Đã có does/doesn't thì động từ trở về nguyên mẫu."],["Do she like tea?","Does she like tea?","He/She/It dùng Does."],["I am work in Hanoi.","I work in Hanoi.","Không dùng am/is/are cùng động từ thường ở thì này."]]}
 ],
 exs:[
  {t:"fill",q:"He ___ (go) to work at 7 a.m.",a:["goes"],e:"He + V-es: go → goes."},
  {t:"mcq",q:"She ___ coffee.",o:["don't like","doesn't like","doesn't likes","not like"],a:1,e:"She + doesn't + V nguyên mẫu."},
  {t:"mcq",q:"___ they live in Hanoi?",o:["Does","Do","Are","Is"],a:1,e:"They dùng Do."},
  {t:"fill",q:"My daughter ___ (study) English every day.",a:["studies"],e:"Phụ âm + y → ies: study → studies."},
  {t:"order",a:"Does he work in an office?",vi:"Anh ấy có làm việc ở văn phòng không?",e:"Does + he + work (nguyên mẫu)…?"},
  {t:"tr",q:"Dịch: “Tôi uống cà phê mỗi sáng.”",a:["i drink coffee every morning","i drink coffee in the morning every day","every morning i drink coffee"],e:"I drink coffee every morning."},
  {t:"listen",say:"She works in a hospital.",o:["She works in a hospital.","She worked in a hospital.","He works in a hotel.","She walks to the hospital."],a:0,e:"She works in a hospital = Cô ấy làm việc ở bệnh viện."},
  {t:"mcq",q:"Câu nào SAI?",o:["I work in Hanoi.","He has a car.","I am work here.","They don't smoke."],a:2,e:"“I am work” sai – phải là “I work”."}
 ]},
{id:"l1-6",level:1,title:"Giới thiệu bản thân và gia đình",grammar:false,min:15,
 goal:"Nói được 5–7 câu giới thiệu về mình và gia đình.",
 sec:[
  {h:"Mẫu câu quan trọng",table:{head:["Mẫu câu","Nghĩa"],rows:[["My name is … / I'm …","Tên tôi là …"],["I am … years old.","Tôi … tuổi."],["I'm from … / I live in …","Tôi đến từ … / Tôi sống ở …"],["I am a/an … / I work as a/an …","Tôi là … / Tôi làm nghề …"],["There are … people in my family.","Gia đình tôi có … người."],["I have … / My … is …","Tôi có … / … của tôi là …"]]}},
  {h:"Đoạn mẫu – bấm 🔊 để nghe từng câu",ex:[["Hi, my name is Nam.","Xin chào, tôi tên là Nam."],["I am 40 years old.","Tôi 40 tuổi."],["I live in Hanoi.","Tôi sống ở Hà Nội."],["I am an engineer.","Tôi là kỹ sư."],["There are four people in my family.","Gia đình tôi có bốn người."],["My wife is a teacher.","Vợ tôi là giáo viên."],["We have two daughters.","Chúng tôi có hai con gái."],["Nice to meet you!","Rất vui được gặp bạn!"]]},
  {h:"Lỗi thường gặp",mis:[["My family have 4 people.","There are four people in my family.","Cách nói tự nhiên dùng “There are … in my family”."],["I am living in Hanoi since 2010.","I have lived in Hanoi since 2010. (sẽ học sau) / I live in Hanoi.","Ở trình độ này, nói đơn giản: I live in Hanoi."],["My name Nam.","My name is Nam.","Không được bỏ “is”."]]},
  {h:"Thực hành",p:"Viết đoạn giới thiệu của bạn ra giấy theo mẫu trên, sau đó đọc to 3 lần. (Chức năng ghi âm và chấm phát âm sẽ có ở giai đoạn sau.)"}
 ],
 exs:[
  {t:"fill",q:"My name ___ Lan.",a:["is"],e:"My name is Lan."},
  {t:"mcq",q:"Câu tự nhiên nhất để nói “Gia đình tôi có 4 người”:",o:["My family have 4 people.","There are four people in my family.","My family is 4 people.","I have 4 family."],a:1,e:"There are four people in my family."},
  {t:"order",a:"I live in Ho Chi Minh City.",vi:"Tôi sống ở Thành phố Hồ Chí Minh.",e:"I + live + in + nơi chốn."},
  {t:"tr",q:"Dịch: “Tôi có hai con gái.”",a:["i have two daughters","i have 2 daughters"],e:"I have two daughters."},
  {t:"fill",q:"I work ___ an engineer.",a:["as"],e:"work as + a/an + nghề = làm nghề …"},
  {t:"listen",say:"My wife is a teacher.",o:["My wife is a teacher.","My wife is a doctor.","My sister is a teacher.","My wife is a nurse."],a:0,e:"My wife is a teacher = Vợ tôi là giáo viên."},
  {t:"mcq",q:"“Where do you live?” – Câu trả lời đúng:",o:["I live Hanoi.","I live in Hanoi.","I am live in Hanoi.","I lives in Hanoi."],a:1,e:"I live in Hanoi."}
 ]}

/* ===== LEVEL 2: GIAO TIẾP CƠ BẢN ===== */
LESSONS.push(
{id:"l2-1",level:2,title:"Thì hiện tại tiếp diễn",grammar:true,min:15,
 goal:"Nói về việc đang xảy ra ngay lúc nói và kế hoạch gần.",
 sec:[
  {h:"Dùng khi nào?",p:"1) Việc <b>đang xảy ra lúc nói</b>: I'm cooking now.<br>2) Việc <b>tạm thời</b> trong giai đoạn này: She's working in Da Nang this month.<br>3) <b>Kế hoạch đã sắp xếp</b> trong tương lai gần: We're meeting the client tomorrow.<br>Dấu hiệu: <i>now, right now, at the moment, today, this week, Look!, Listen!</i>"},
  {h:"Công thức",formula:"(+) S + am/is/are + V-ing        → She is working.\n(-) S + am/is/are + not + V-ing  → She isn't working.\n(?) Am/Is/Are + S + V-ing ...?   → Is she working? – Yes, she is."},
  {h:"Cách thêm -ing",table:{head:["Quy tắc","Ví dụ"],rows:[["Thông thường + ing","work → working, read → reading"],["Tận cùng e câm → bỏ e","write → writing, come → coming"],["1 âm tiết, phụ âm – nguyên âm – phụ âm → gấp đôi phụ âm cuối","run → running, sit → sitting, stop → stopping"],["ie → ying","lie → lying, die → dying"]]}},
  {h:"So sánh với hiện tại đơn",ex:[["I usually drink tea, but today I'm drinking coffee.","Tôi thường uống trà, nhưng hôm nay tôi đang uống cà phê."],["He works in Hanoi. Right now he's visiting a site in Bac Ninh.","Anh ấy làm việc ở Hà Nội. Lúc này anh ấy đang đi công trình ở Bắc Ninh."]]},
  {h:"Lỗi thường gặp",mis:[["I working now.","I am working now.","Không được bỏ am/is/are."],["She is write an email.","She is writing an email.","Sau am/is/are phải là V-ing."],["I am knowing him.","I know him.","Động từ chỉ trạng thái (know, like, want, need, understand) thường không dùng -ing."],["He is siting.","He is sitting.","sit → sitting (gấp đôi t)."]]}
 ],
 exs:[
  {t:"fill",q:"She ___ (cook) dinner now.",a:["is cooking"],e:"She + is + cooking."},
  {t:"fill",q:"Look! The children ___ (run) in the park.",a:["are running"],e:"run → running (gấp đôi n); children số nhiều → are."},
  {t:"mcq",q:"I ___ him very well.",o:["know","am knowing","knowing","am know"],a:0,e:"know là động từ trạng thái → không dùng -ing."},
  {t:"mcq",q:"Dạng -ing của “write”:",o:["writing","writeing","writting","wrote"],a:0,e:"Bỏ e câm rồi thêm ing: writing."},
  {t:"mcq",q:"My father usually ___ to work by car, but today he ___ by bus.",o:["drives / is going","is driving / goes","drives / goes","is driving / is going"],a:0,e:"usually → hiện tại đơn; today (tạm thời) → hiện tại tiếp diễn."},
  {t:"order",a:"What are you doing now?",x:["do"],vi:"Bạn đang làm gì vậy?",e:"What + are + you + doing?"},
  {t:"tr",q:"Dịch: “Tôi đang làm việc ở văn phòng.”",a:["i am working in the office","i am working at the office","i am working in my office","i am working at my office"],e:"I'm working in/at the office."},
  {t:"tr",q:"Dịch: “Bây giờ cô ấy không xem TV.”",a:["she is not watching tv now","now she is not watching tv","she is not watching tv right now","she is not watching television now"],e:"She isn't watching TV now."},
  {t:"listen",say:"They are having lunch.",o:["They are having lunch.","They have lunch.","They had lunch.","They are making lunch."],a:0,e:"have lunch = ăn trưa → are having lunch = đang ăn trưa."},
  {t:"dict",say:"Is it raining now?",a:["is it raining now"],e:"Is it raining now? = Bây giờ trời có đang mưa không?"},
  {t:"fill",q:"Listen! Someone ___ (sing).",a:["is singing"],e:"Listen! → việc đang xảy ra → is singing."},
  {t:"dlg",lines:[["A","Hi Lan, what are you doing?"],["B","I'm cooking dinner. My husband is watching TV and the kids are doing their homework."]],q:"Ai đang làm bài tập?",o:["Bọn trẻ","Chồng Lan","Lan","Không ai"],a:0,e:"“the kids are doing their homework”."}
 ]},
{id:"l2-2",level:2,title:"Thì quá khứ đơn",grammar:true,min:18,
 goal:"Kể lại việc đã xảy ra và đã kết thúc.",
 sec:[
  {h:"Dùng khi nào?",p:"Việc <b>đã xảy ra và kết thúc</b> trong quá khứ. Dấu hiệu: <i>yesterday, last night/week/year, ... ago, in 2020, when I was young</i>."},
  {h:"Động từ To Be: was / were",formula:"I / He / She / It + was     → I was tired.\nYou / We / They   + were    → They were at home.\nPhủ định: wasn't / weren't · Câu hỏi: Was he...? Were you...?"},
  {h:"Động từ thường",formula:"(+) S + V-ed / V cột 2          → I worked. I went.\n(-) S + did not (didn't) + V     → I didn't go.\n(?) Did + S + V ...?             → Did you go? – Yes, I did."},
  {h:"Thêm -ed",table:{head:["Quy tắc","Ví dụ"],rows:[["Thông thường + ed","work → worked, call → called"],["Tận cùng e → + d","live → lived, like → liked"],["Phụ âm + y → ied","study → studied, try → tried"],["1 âm tiết PÂ–NÂ–PÂ → gấp đôi","stop → stopped, plan → planned"]]}},
  {h:"Động từ bất quy tắc hay dùng",table:{head:["Nguyên mẫu","Quá khứ","Nghĩa"],rows:[["go","went","đi"],["have","had","có, ăn"],["do","did","làm"],["eat","ate","ăn"],["see","saw","thấy"],["buy","bought","mua"],["come","came","đến"],["get","got","nhận, đến"],["make","made","làm, chế tạo"],["take","took","lấy, mất (thời gian)"],["meet","met","gặp"],["say","said","nói"]]}},
  {h:"Phát âm đuôi -ed",p:"<b>/t/</b> sau âm vô thanh: worked, stopped, watched.<br><b>/d/</b> sau âm hữu thanh: lived, called, played.<br><b>/ɪd/</b> sau âm /t/ hoặc /d/: wanted, needed, visited."},
  {h:"Lỗi thường gặp",mis:[["I go to Da Nang last week.","I went to Da Nang last week.","Có last week → động từ chia quá khứ."],["Did you went there?","Did you go there?","Sau did dùng V nguyên mẫu."],["I didn't saw him.","I didn't see him.","Sau didn't dùng V nguyên mẫu."],["She was go home.","She went home.","Không ghép was với động từ thường."]]}
 ],
 exs:[
  {t:"fill",q:"I ___ (go) to Da Nang last week.",a:["went"],e:"go → went (bất quy tắc)."},
  {t:"fill",q:"We ___ (be) very tired yesterday.",a:["were"],e:"We → were."},
  {t:"mcq",q:"___ you see the email yesterday?",o:["Did","Do","Were","Was"],a:0,e:"Câu hỏi quá khứ với động từ thường: Did + S + V?"},
  {t:"mcq",q:"She didn't ___ breakfast this morning.",o:["have","had","has","having"],a:0,e:"Sau didn't → V nguyên mẫu."},
  {t:"fill",q:"They ___ (buy) a new car last month.",a:["bought"],e:"buy → bought."},
  {t:"mcq",q:"Đuôi -ed trong “wanted” đọc là:",o:["/t/","/d/","/ɪd/"],a:2,e:"Sau âm /t/ → /ɪd/: wanted /ˈwɑːntɪd/."},
  {t:"order",a:"Where did you go last weekend?",x:["went"],vi:"Cuối tuần trước bạn đã đi đâu?",e:"Where + did + you + go (nguyên mẫu)."},
  {t:"tr",q:"Dịch: “Hôm qua tôi đã gặp khách hàng.”",a:["i met the client yesterday","yesterday i met the client","i met a client yesterday","i met the customer yesterday","yesterday i met a client","i met my client yesterday"],e:"I met the client yesterday."},
  {t:"tr",q:"Dịch: “Hôm qua anh ấy không đi làm.”",a:["he did not go to work yesterday","yesterday he did not go to work"],e:"He didn't go to work yesterday."},
  {t:"listen",say:"I studied English last night.",o:["I studied English last night.","I study English every night.","I studied English last week.","I'm studying English tonight."],a:0,e:"studied = đã học; last night = tối qua."},
  {t:"dict",say:"We were at home yesterday.",a:["we were at home yesterday"],e:"We were at home yesterday."},
  {t:"dlg",lines:[["A","How was your weekend?"],["B","It was great. I visited my parents in Hai Phong."],["A","Did you drive there?"],["B","No, I didn't. I took the bus."]],q:"Cuối tuần người B đã làm gì?",o:["Thăm bố mẹ ở Hải Phòng, đi xe buýt","Thăm bố mẹ ở Hải Phòng, tự lái xe","Ở nhà nghỉ ngơi","Đi Hà Nội bằng xe buýt"],a:0,e:"visited my parents in Hai Phong … I took the bus."}
 ]},
{id:"l2-3",level:2,title:"Thì tương lai: will và be going to",grammar:true,min:15,

 sec:[
  {h:"will + V",p:"Dùng cho <b>quyết định ngay lúc nói</b>, <b>lời hứa</b>, <b>đề nghị</b>, <b>dự đoán chung</b>.",formula:"(+) S + will ('ll) + V        → I'll call you.\n(-) S + will not (won't) + V  → She won't come.\n(?) Will + S + V ...?         → Will you help me?"},
  {h:"be going to + V",p:"Dùng cho <b>kế hoạch đã định trước</b> và <b>dự đoán có dấu hiệu rõ ràng</b>.",formula:"S + am/is/are + going to + V  → We're going to visit Da Lat.\nLook at the clouds! It's going to rain."},
  {h:"Ví dụ so sánh",ex:[["The phone is ringing. – I'll answer it.","Điện thoại reo. – Để tôi nghe. (quyết định ngay)"],["I'm going to buy a new laptop next month. I've saved the money.","Tháng sau tôi sẽ mua laptop mới. Tôi đã để dành tiền rồi. (kế hoạch)"],["I'll send you the file tomorrow, I promise.","Mai tôi sẽ gửi file, tôi hứa."]]},
  {h:"Lỗi thường gặp",mis:[["I will to call you.","I will call you.","Sau will dùng V nguyên mẫu, không có “to”."],["She will goes.","She will go.","Sau will không chia động từ."],["I going to buy it.","I am going to buy it.","Thiếu am/is/are."],["Will you to come?","Will you come?","Bỏ “to”."]]}
 ],

{id:"l2-6",level:2,title:"Hỏi đường và chỉ đường",grammar:false,min:15,

{id:"l3-5",level:3,title:"Trao đổi công việc và họp",grammar:false,min:18,
 goal:"Nêu ý kiến, đồng ý/không đồng ý lịch sự, điều hành cuộc họp.",
 sec:[
  {h:"Từ vựng chính",words:[["agenda","/əˈdʒɛndə/","chương trình họp"],["opinion","/əˈpɪnjən/","ý kiến"],["suggest","/səɡˈdʒɛst/","đề xuất"],["clarify","/ˈklærəfaɪ/","làm rõ"],["budget","/ˈbʌdʒɪt/","ngân sách"],["progress","/ˈprɑːɡrɛs/","tiến độ"],["issue","/ˈɪʃuː/","vấn đề"],["solution","/səˈluːʃən/","giải pháp"]]},
  {h:"Nêu ý kiến",ex:[["In my opinion, we need more workers on site.","Theo tôi, chúng ta cần thêm công nhân ở công trường."],["I think we should finish the ceiling first.","Tôi nghĩ ta nên làm xong trần trước."],["I suggest we order the materials this week.","Tôi đề xuất đặt vật tư trong tuần này."]]},
  {h:"Đồng ý và không đồng ý lịch sự",ex:[["I agree with you. / That's a good point.","Tôi đồng ý. / Ý hay đấy."],["I see your point, but the budget is limited.","Tôi hiểu ý anh, nhưng ngân sách có hạn."],["I'm not sure that's a good idea.","Tôi không chắc đó là ý hay."]]},
  {h:"Điều hành cuộc họp",ex:[["Let's start. The first item on the agenda is the budget.","Bắt đầu nhé. Mục đầu tiên là ngân sách."],["Could you clarify that?","Anh làm rõ điểm đó được không?"],["Let's move on to the next point.","Chuyển sang mục tiếp theo."],["Let me check and get back to you.","Để tôi kiểm tra rồi phản hồi anh."]]},
  {h:"Lỗi thường gặp",mis:[["I don't agree you.","I don't agree with you.","agree with sb."],["Your idea is wrong!","I see your point, but…","Phản đối lịch sự để giữ quan hệ."],["I will feedback to you.","I'll get back to you.","feedback là danh từ trong câu này."],["Let's discuss about the budget.","Let's discuss the budget.","discuss không đi với about."]]}
 ],
 exs:[
  {t:"mcq",q:"Cách không đồng ý LỊCH SỰ:",o:["I see your point, but the budget is limited.","Your idea is wrong.","No, you are wrong.","I don't agree you."],a:0,e:"I see your point, but…"},
  {t:"fill",q:"Let's ___ on to the next point.",a:["move"],e:"move on to = chuyển sang."},
  {t:"fill",q:"In my ___, we need more workers on site.",a:["opinion"],e:"In my opinion = Theo ý tôi."},
  {t:"mcq",q:"Let's discuss ___ budget.",o:["the","about the","for the","on the"],a:0,e:"discuss + tân ngữ trực tiếp, không có about."},
  {t:"reflex",say:"What do you think about the new schedule?",o:["I think it's a bit too tight.","Yes, I think.","I don't think so about it.","It's Monday."],a:0,e:"Nêu ý kiến: I think it's…"},
  {t:"reflex",say:"Could you send me the progress report by Friday?",o:["Sure, I'll send it by Thursday afternoon.","Yes, I sent.","No problem, I send yesterday.","Friday is good day."],a:0,e:"Sure, I'll…"},
  {t:"order",a:"Let me check and get back to you.",x:["feedback"],vi:"Để tôi kiểm tra rồi phản hồi anh.",e:"get back to sb = phản hồi lại."},
  {t:"tr",q:"Dịch: “Tôi đề xuất chúng ta đặt vật tư trong tuần này.”",a:["i suggest we order the materials this week","i suggest that we order the materials this week","i suggest we order materials this week","i suggest that we order materials this week","i suggest ordering the materials this week","i suggest ordering materials this week"],e:"I suggest (that) we order the materials this week."},
  {t:"tr",q:"Dịch: “Anh có thể làm rõ điều đó không?”",a:["could you clarify that","can you clarify that","could you clarify that please","can you clarify that please"],e:"Could you clarify that?"},
  {t:"dict",say:"The first item on the agenda is the budget.",a:["the first item on the agenda is the budget"],e:"agenda = chương trình họp."},
  {t:"dlg",lines:[["A","Let's start. The first item is the project progress. Minh?"],["B","We're about two weeks behind schedule because the materials arrived late."],["A","I see. What do you suggest?"],["B","I suggest we add five more workers and work on Saturdays."],["A","That's a good idea, but we need to check the budget first."]],q:"Dự án chậm bao lâu, vì sao?",o:["Khoảng 2 tuần, vật tư về muộn","Khoảng 2 tuần, thiếu công nhân","Khoảng 5 ngày, vật tư về muộn","Không chậm"],a:0,e:"two weeks behind schedule because the materials arrived late."},
  {t:"dlg",lines:[["A","I see. What do you suggest?"],["B","I suggest we add five more workers and work on Saturdays."],["A","That's a good idea, but we need to check the budget first."]],q:"Minh đề xuất gì?",o:["Thêm 5 công nhân và làm thứ Bảy","Thêm 2 công nhân và làm Chủ nhật","Đổi nhà cung cấp vật tư","Tăng ngân sách"],a:0,e:"add five more workers and work on Saturdays."}
 ]},
{id:"l3-6",level:3,title:"Viết tin nhắn và email đơn giản",grammar:false,min:20,
 goal:"Viết email công việc ngắn đúng cấu trúc và tin nhắn tự nhiên.",
 sec:[
  {h:"Cấu trúc email",table:{head:["Phần","Mẫu câu"],rows:[["Tiêu đề (Subject)","Request to reschedule our meeting"],["Lời chào","Dear Mr. Smith, (trang trọng, dùng HỌ) · Hi Anna, (thân mật, dùng TÊN)"],["Mở đầu","I'm writing to ask about… · I hope you are well."],["Nội dung","Could you please…? · I would like to…"],["Kết","Please let me know if you have any questions. · I look forward to hearing from you."],["Ký tên","Best regards, / Kind regards, + tên"]]}},
  {h:"Email mẫu",ex:[["Subject: Delivery date for order No. 25","Tiêu đề: Ngày giao đơn hàng số 25"],["Dear Ms. Taylor,","Kính gửi bà Taylor,"],["I'm writing to ask about the delivery date of our order.","Tôi viết thư để hỏi về ngày giao đơn hàng của chúng tôi."],["Could you please confirm it by Friday?","Bà vui lòng xác nhận trước thứ Sáu được không?"],["I look forward to hearing from you.","Mong sớm nhận phản hồi của bà."],["Best regards, Le An","Trân trọng, Lê An"]]},

  {h:"Lỗi thường gặp",mis:[["Dear Mr. John, (John Smith)","Dear Mr. Smith,","Mr./Ms. + HỌ."],["I write this email to inform you…","I'm writing to let you know…","Tự nhiên hơn."],["Waiting for your reply.","I look forward to hearing from you.","Câu cũ nghe cộc."],["Best regard,","Best regards,","regards có s."]]}
 ],

  {t:"mcq",q:"Lời chào trang trọng gửi ông John Smith:",o:["Dear Mr. Smith,","Dear Mr. John,","Hi John Smith!","Hey Mr. Smith,"],a:0,e:"Mr. + họ (Smith)."},
  {t:"fill",q:"I'm writing ___ ask about the delivery date.",a:["to"],e:"I'm writing to + V."},
  {t:"mcq",q:"Câu kết email lịch sự:",o:["I look forward to hearing from you.","Waiting your reply.","Reply me soon.","You must answer."],a:0,e:"look forward to + V-ing."},
  {t:"fill",q:"Best ___, (dòng kết thư)",a:["regards"],e:"Best regards,"},
  {t:"mcq",q:"Tin nhắn phù hợp để báo đồng nghiệp bạn đến muộn:",o:["Running 10 mins late, sorry!","I would like to inform you that I will be late.","Dear colleague, I am late.","Late."],a:0,e:"Tin nhắn thân mật: ngắn gọn, tự nhiên."},
  {t:"order",a:"Please let me know if you have any questions.",x:["for"],vi:"Vui lòng cho tôi biết nếu bạn có câu hỏi.",e:"let me know if…"},
  {t:"tr",q:"Dịch: “Tôi viết thư để hỏi về ngày giao hàng.”",a:["i am writing to ask about the delivery date","i am writing to ask about the date of delivery","i am writing this email to ask about the delivery date","i am writing to ask about the delivery time"],e:"I'm writing to ask about the delivery date."},
  {t:"mcq",text:"Dear Ms. Hoa,\nI'm writing to confirm our meeting on Thursday at 10 a.m. at our office. Could you please bring the updated drawings? If you cannot come, please let me know by Wednesday.\nBest regards,\nDavid Brown",q:"Bà Hoa cần mang theo gì?",o:["Bản vẽ cập nhật","Hợp đồng","Báo giá","Hóa đơn"],a:0,e:"bring the updated drawings."},
  {t:"mcq",text:"Dear Ms. Hoa,\nI'm writing to confirm our meeting on Thursday at 10 a.m. at our office. Could you please bring the updated drawings? If you cannot come, please let me know by Wednesday.\nBest regards,\nDavid Brown",q:"Nếu không đến được, bà Hoa phải báo trước khi nào?",o:["Thứ Tư","Thứ Năm","Thứ Sáu","10 giờ sáng thứ Năm"],a:0,e:"let me know by Wednesday."},
  {t:"write",q:"Viết email gửi anh Peter để xin dời cuộc họp chiều mai sang thứ Sáu.",min:30,

   sample:"Hi Peter,\nI'm writing to ask if we can reschedule our meeting tomorrow afternoon. I'm sorry, but I have to visit a construction site because there is an urgent problem. Could we meet on Friday at 2 p.m. instead? Please let me know if that works for you.\nBest regards,\nAn",e:"Email gồm: chào – lý do – đề xuất – kết – ký tên."}
 ]}

{id:"l4-1",level:4,title:"Thì hiện tại hoàn thành",grammar:true,min:20,

  {h:"Hiện tại hoàn thành hay quá khứ đơn?",ex:[["I visited Japan in 2019.","Có mốc thời gian quá khứ cụ thể → quá khứ đơn."],["I have visited Japan twice.","Không nói khi nào, nói về trải nghiệm → hiện tại hoàn thành."]]},

 ],

  {t:"fill",q:"My office is not as big ___ yours.",a:["as"],e:"not as … as."},

  {t:"tr",q:"Dịch: “Phương án này tốt hơn phương án kia.”",a:["this option is better than that one","this option is better than that option","this option is better than the other one","this option is better than the other","this plan is better than that one","this solution is better than that one"],e:"This option is better than that one."},
  {t:"tr",q:"Dịch: “Đây là khách sạn đắt nhất trong thành phố.”",a:["this is the most expensive hotel in the city","this is the most expensive hotel in town"],e:"This is the most expensive hotel in the city."},
  {t:"listen",lbl:"Nghe và dịch nghĩa",say:"Supplier B is cheaper, but supplier A is faster.",o:["Nhà cung cấp B rẻ hơn, nhưng A nhanh hơn.","Nhà cung cấp A rẻ hơn, nhưng B nhanh hơn.","B rẻ nhất và nhanh nhất.","A và B giá như nhau."],a:0,e:"cheaper = rẻ hơn; faster = nhanh hơn."},
  {t:"dict",say:"This is the best solution.",a:["this is the best solution"],e:"the best = tốt nhất."},
  {t:"dlg",lines:[["A","Which quotation do you prefer?"],["B","Company X is the cheapest, but their delivery time is the longest."],["A","And Company Y?"],["B","It's a bit more expensive, but the quality is better and they can deliver in one week."],["A","OK, let's choose Company Y."]],q:"Họ chọn công ty nào, vì sao?",o:["Công ty Y – chất lượng tốt hơn, giao nhanh","Công ty X – rẻ nhất","Công ty Y – rẻ nhất","Công ty X – giao nhanh nhất"],a:0,e:"Y: more expensive, but quality is better and deliver in one week."}
 ]},
{id:"l4-3",level:4,title:"Câu điều kiện loại 1 và loại 2",grammar:true,min:18,
 goal:"Nói về điều có thể xảy ra và điều giả định.",
 sec:[
  {h:"Loại 1 – có thể xảy ra",p:"Điều kiện có thật ở hiện tại hoặc tương lai.",formula:"If + hiện tại đơn, S + will + V\nIf it rains, we will stay at home.\nunless = if … not: Unless you hurry, you will miss the bus."},
  {h:"Loại 2 – giả định, không có thật",p:"Điều không có thật hoặc khó xảy ra ở hiện tại. Dùng <b>were</b> cho mọi ngôi (trang trọng).",formula:"If + quá khứ đơn, S + would + V\nIf I had more time, I would learn Japanese.\nIf I were you, I would accept the offer."},
  {h:"Ví dụ",ex:[["If the materials arrive on time, we will finish next month.","Nếu vật tư về đúng hạn, ta sẽ xong vào tháng sau."],["If I were the manager, I would hire more engineers.","Nếu tôi là quản lý, tôi sẽ tuyển thêm kỹ sư."]]},
  {h:"Lỗi thường gặp",mis:[["If it will rain, …","If it rains, …","Mệnh đề If không dùng will."],["If I have money, I would buy…","If I had money, I would buy…","Loại 2: If + quá khứ."],["If you don't hurry, you will late.","…you will be late.","late là tính từ → be late."]]}
 ],
 exs:[
  {t:"fill",q:"If it ___ (rain) tomorrow, we will cancel the trip.",a:["rains"],e:"Loại 1: If + hiện tại đơn."},
  {t:"mcq",q:"If you study hard, you ___ the exam.",o:["will pass","would pass","passed","pass"],a:0,e:"Loại 1: will + V."},
  {t:"mcq",q:"If I ___ rich, I would buy a big house.",o:["were","am","will be","be"],a:0,e:"Loại 2: If I were…"},
  {t:"fill",q:"If I were you, I ___ accept the offer.",a:["would"],e:"Loại 2: would + V."},
  {t:"mcq",q:"Câu điều kiện loại 2 diễn tả:",o:["Điều không có thật / khó xảy ra ở hiện tại","Điều chắc chắn xảy ra","Việc đã xảy ra","Thói quen"],a:0,e:"Giả định, trái với hiện tại."},
  {t:"mcq",q:"___ you hurry, you will miss the bus.",o:["Unless","If","When","Because"],a:0,e:"Unless = If … not."},
  {t:"order",a:"If I had more time, I would learn Japanese.",x:["will"],vi:"Nếu có nhiều thời gian hơn, tôi sẽ học tiếng Nhật.",e:"Loại 2 dùng would, không dùng will."},
  {t:"tr",q:"Dịch: “Nếu bạn cần giúp, hãy gọi cho tôi.”",a:["if you need help call me","if you need help please call me","if you need any help call me","if you need any help please call me","call me if you need help","please call me if you need help","call me if you need any help"],e:"If you need help, call me."},
  {t:"tr",q:"Dịch: “Nếu tôi là bạn, tôi sẽ không ký hợp đồng này.”",a:["if i were you i would not sign this contract","if i was you i would not sign this contract","if i were you i would not sign the contract","if i was you i would not sign the contract","i would not sign this contract if i were you"],e:"If I were you, I wouldn't sign this contract."},
  {t:"listen",lbl:"Nghe và dịch nghĩa",say:"If the materials arrive on time, we will finish next month.",o:["Nếu vật tư về đúng hạn, chúng ta sẽ xong vào tháng sau.","Vì vật tư về đúng hạn, chúng ta đã xong tháng trước.","Nếu vật tư về muộn, chúng ta sẽ xong vào tháng sau.","Vật tư sẽ về vào tháng sau."],a:0,e:"Câu điều kiện loại 1."},
  {t:"dict",say:"What would you do if you won the lottery?",a:["what would you do if you won the lottery"],e:"Loại 2: Bạn sẽ làm gì nếu trúng xổ số?"},
  {t:"dlg",lines:[["A","The client wants to change the design again."],["B","If they change it again, we will need two more weeks."],["A","And the cost?"],["B","If I were the project manager, I would ask them to pay for the extra work."]],q:"Nếu khách đổi thiết kế, cần thêm bao lâu?",o:["2 tuần","1 tuần","2 tháng","Không cần thêm"],a:0,e:"we will need two more weeks."}
 ]},
{id:"l4-4",level:4,title:"Câu bị động",grammar:true,min:18,
 goal:"Dùng bị động khi muốn nhấn vào sự việc, không nhấn vào người làm.",
 sec:[
  {h:"Khi nào dùng?",p:"Khi <b>điều quan trọng là việc/đồ vật</b>, còn người làm không quan trọng hoặc không rõ. Rất hay gặp trong báo cáo kỹ thuật, thông báo, hợp đồng."},
  {h:"Công thức: be + V3",table:{head:["Thì","Bị động","Ví dụ"],rows:[["Hiện tại đơn","is/are + V3","English is spoken here."],["Quá khứ đơn","was/were + V3","The building was completed in 2020."],["Tương lai","will be + V3","The materials will be delivered tomorrow."],["Hiện tại hoàn thành","has/have been + V3","The contract has been signed."]]}},
  {h:"Chủ động → bị động",ex:[["The workers installed the pumps. → The pumps were installed (by the workers).","Công nhân lắp bơm. → Bơm đã được lắp."],["They will test the system next week. → The system will be tested next week.","Hệ thống sẽ được chạy thử tuần sau."]]},
  {h:"Lỗi thường gặp",mis:[["The report was wrote.","The report was written.","V3 của write là written."],["The goods delivered yesterday.","The goods were delivered yesterday.","Thiếu be."],["The contract has signed.","The contract has been signed.","Thiếu been."],["It was made by China.","It was made in China.","Nơi sản xuất dùng in."]]}
 ],
 exs:[
  {t:"fill",q:"The building ___ (complete) in 2020.",a:["was completed"],e:"Quá khứ bị động: was + V3."},
  {t:"mcq",q:"English ___ in many countries.",o:["is spoken","speaks","is speaking","spoke"],a:0,e:"Hiện tại bị động: is + spoken."},
  {t:"mcq",q:"The materials will ___ tomorrow.",o:["be delivered","deliver","delivered","be deliver"],a:0,e:"will be + V3."},
  {t:"fill",q:"The contract has ___ signed.",a:["been"],e:"has been + V3."},
  {t:"mcq",q:"Câu ĐÚNG:",o:["The report was written by Lan.","The report was wrote by Lan.","The report written by Lan.","The report is write by Lan."],a:0,e:"was + written."},
  {t:"order",a:"The meeting has been cancelled.",x:["was"],vi:"Cuộc họp đã bị hủy.",e:"has been + V3."},
  {t:"tr",q:"Dịch: “Ngôi nhà này được xây năm 1990.”",a:["this house was built in 1990","the house was built in 1990"],e:"This house was built in 1990."},
  {t:"tr",q:"Dịch: “Hàng sẽ được giao vào thứ Hai.”",a:["the goods will be delivered on monday","the goods will be delivered monday","the order will be delivered on monday","goods will be delivered on monday","the products will be delivered on monday"],e:"The goods will be delivered on Monday."},
  {t:"listen",lbl:"Nghe và dịch nghĩa",say:"All the cables were checked yesterday.",o:["Tất cả dây cáp đã được kiểm tra hôm qua.","Tất cả dây cáp sẽ được kiểm tra ngày mai.","Hôm qua chúng tôi kiểm tra một số dây cáp.","Dây cáp chưa được kiểm tra."],a:0,e:"were checked = đã được kiểm tra."},
  {t:"dict",say:"This machine is made in Japan.",a:["this machine is made in japan"],e:"made in + nước sản xuất."},
  {t:"mcq",text:"NOTICE\nThe main water supply will be turned off on Saturday from 8 a.m. to 2 p.m. because the pipes are being repaired. Residents are advised to store water before Saturday. We apologize for any inconvenience.\nBuilding Management",q:"Nước bị cắt trong bao lâu?",o:["6 tiếng (8h–14h)","8 tiếng","2 tiếng","Cả ngày thứ Bảy"],a:0,e:"from 8 a.m. to 2 p.m."},
  {t:"mcq",text:"NOTICE\nThe main water supply will be turned off on Saturday from 8 a.m. to 2 p.m. because the pipes are being repaired. Residents are advised to store water before Saturday. We apologize for any inconvenience.\nBuilding Management",q:"Vì sao bị cắt nước, cư dân nên làm gì?",o:["Sửa đường ống; trữ nước trước thứ Bảy","Thiếu nước; mua nước đóng chai","Vệ sinh bể; rời khỏi tòa nhà","Không rõ lý do; gọi ban quản lý"],a:0,e:"the pipes are being repaired … store water before Saturday."}
 ]},
{id:"l4-5",level:4,title:"Đọc hiểu văn bản",grammar:false,min:20,
 goal:"Đọc tin tuyển dụng, bài báo ngắn; tìm ý chính và chi tiết.",
 sec:[
  {h:"Chiến lược đọc",p:"1) <b>Đọc câu hỏi trước</b> để biết cần tìm gì.<br>2) <b>Đọc lướt</b> (skimming) để nắm ý chính.<br>3) <b>Đọc quét</b> (scanning) tìm số, tên, ngày tháng.<br>4) <b>Đoán nghĩa từ mới</b> qua ngữ cảnh, không cần tra từng từ."},
  {h:"Từ vựng hay gặp",words:[["apply","/əˈplaɪ/","nộp đơn, ứng tuyển"],["requirement","/rɪˈkwaɪərmənt/","yêu cầu"],["experience","/ɪkˈspɪriəns/","kinh nghiệm"],["salary","/ˈsæləri/","lương"],["benefit","/ˈbɛnəfɪt/","phúc lợi, lợi ích"],["however","/haʊˈɛvər/","tuy nhiên"]]},
  {h:"Từ nối giúp đoán ý",p:"<b>However / but</b> → ý trái ngược sắp đến. <b>Because / so</b> → nguyên nhân – kết quả. <b>For example</b> → ví dụ minh họa. <b>In short</b> → tóm tắt."}
 ],
 exs:[
  {t:"mcq",text:"JOB VACANCY – Site Engineer (MEP)\nGreen Star Engineering is looking for a site engineer for a factory project in Bac Ninh. Requirements: a degree in electrical or mechanical engineering, at least two years of experience, and basic English. We offer a competitive salary, health insurance and a company phone. Please send your CV before 30 November.",q:"Vị trí này làm việc ở đâu?",o:["Dự án nhà máy ở Bắc Ninh","Văn phòng ở Hà Nội","Nhà máy ở Hải Phòng","Không nói"],a:0,e:"a factory project in Bac Ninh."},
  {t:"mcq",text:"JOB VACANCY – Site Engineer (MEP)\nGreen Star Engineering is looking for a site engineer for a factory project in Bac Ninh. Requirements: a degree in electrical or mechanical engineering, at least two years of experience, and basic English. We offer a competitive salary, health insurance and a company phone. Please send your CV before 30 November.",q:"Yêu cầu kinh nghiệm:",o:["Ít nhất 2 năm","Không cần kinh nghiệm","Đúng 2 năm","Trên 5 năm"],a:0,e:"at least two years = ít nhất 2 năm."},
  {t:"mcq",text:"JOB VACANCY – Site Engineer (MEP)\nGreen Star Engineering is looking for a site engineer for a factory project in Bac Ninh. Requirements: a degree in electrical or mechanical engineering, at least two years of experience, and basic English. We offer a competitive salary, health insurance and a company phone. Please send your CV before 30 November.",q:"“competitive salary” nghĩa gần nhất:",o:["Lương cạnh tranh, hấp dẫn","Lương thấp","Lương theo giờ","Lương thử việc"],a:0,e:"competitive salary = mức lương cạnh tranh."},
  {t:"mcq",text:"JOB VACANCY – Site Engineer (MEP)\nGreen Star Engineering is looking for a site engineer for a factory project in Bac Ninh. Requirements: a degree in electrical or mechanical engineering, at least two years of experience, and basic English. We offer a competitive salary, health insurance and a company phone. Please send your CV before 30 November.",q:"Phúc lợi nào KHÔNG được nhắc đến?",o:["Xe đưa đón","Bảo hiểm y tế","Điện thoại công ty","Lương cạnh tranh"],a:0,e:"Chỉ có salary, health insurance, company phone."},
  {t:"mcq",text:"More and more people in Vietnam are working from home. Many office workers say they prefer to work from home two or three days a week. They save time and money because they do not have to travel. However, some managers worry that it is harder to communicate with their teams. Experts suggest that companies should use online tools and hold regular short meetings.",q:"Ý chính của đoạn văn:",o:["Xu hướng làm việc tại nhà, lợi ích và khó khăn","Cách mua máy tính","Giao thông ở Việt Nam","Cách tổ chức họp dài"],a:0,e:"Câu đầu tiên thường là câu chủ đề."},
  {t:"mcq",text:"More and more people in Vietnam are working from home. Many office workers say they prefer to work from home two or three days a week. They save time and money because they do not have to travel. However, some managers worry that it is harder to communicate with their teams. Experts suggest that companies should use online tools and hold regular short meetings.",q:"Người lao động được lợi gì?",o:["Tiết kiệm thời gian và tiền đi lại","Lương cao hơn","Được nghỉ nhiều hơn","Gặp đồng nghiệp nhiều hơn"],a:0,e:"save time and money because they do not have to travel."},

  {t:"mcq",text:"More and more people in Vietnam are working from home. Many office workers say they prefer to work from home two or three days a week. They save time and money because they do not have to travel. However, some managers worry that it is harder to communicate with their teams. Experts suggest that companies should use online tools and hold regular short meetings.",q:"Từ “However” trong bài dùng để:",o:["Nêu ý trái ngược","Đưa ví dụ","Kết luận","Thêm ý giống"],a:0,e:"However = tuy nhiên → chuyển sang mặt hạn chế."},
  {t:"mcq",text:"More and more people in Vietnam are working from home. Many office workers say they prefer to work from home two or three days a week. They save time and money because they do not have to travel. However, some managers worry that it is harder to communicate with their teams. Experts suggest that companies should use online tools and hold regular short meetings.",q:"Chuyên gia khuyên gì?",o:["Dùng công cụ trực tuyến và họp ngắn thường xuyên","Quay lại văn phòng 100%","Họp dài mỗi tuần","Giảm lương nhân viên"],a:0,e:"use online tools and hold regular short meetings."},

{id:"l4-6",level:4,title:"Nghe hội thoại dài và nói theo chủ đề",grammar:false,min:20,
 goal:"Nghe cuộc họp dài, nắm số liệu và quyết định; chuẩn bị bài nói 1 phút.",
 sec:[
  {h:"Chiến lược nghe dài",p:"1) Đọc câu hỏi trước. 2) Nghe <b>từ khóa</b>: số, tên, thời gian, từ nối (but, so, because). 3) Không cần hiểu 100% từng từ. 4) Nghe lần đầu lấy ý chính, lần hai lấy chi tiết. Nghe chậm nếu cần."},
  {h:"Nói theo chủ đề: cấu trúc 3 phần",formula:"Mở:  giới thiệu chủ đề          → I'd like to talk about my job.\nThân: 2–3 ý + ví dụ, có từ nối  → First, … Also, … However, …\nKết:  tóm lại / cảm nghĩ         → In short, I really enjoy it."},
  {h:"Bài nói mẫu: “Talk about your job” – bấm 🔊 từng câu",ex:[["I'd like to talk about my job.","Tôi muốn nói về công việc của mình."],["I'm the director of a small engineering company.","Tôi là giám đốc một công ty kỹ thuật nhỏ."],["We install electrical and plumbing systems for buildings.","Chúng tôi lắp hệ thống điện và nước cho các tòa nhà."],["First, my job is busy because I manage many projects.","Đầu tiên, công việc bận rộn vì tôi quản lý nhiều dự án."],["Also, I often meet clients and visit construction sites.","Ngoài ra, tôi thường gặp khách hàng và đi công trường."],["However, every project is different, so it is never boring.","Tuy nhiên, mỗi dự án mỗi khác nên không bao giờ nhàm chán."],["In short, I really enjoy my work.","Tóm lại, tôi rất thích công việc của mình."]]},
  {h:"Luyện nói tiếp",p:"Vào mục <b>Luyện nói → Nói theo chủ đề</b> để đọc và được máy nhận diện các câu chủ đề."}
 ],
 exs:[
  {t:"dlg",lines:DLG_LONG,q:"Cuộc họp bàn về dự án nào?",o:["Khách sạn ở Nha Trang","Nhà máy ở Bắc Ninh","Bệnh viện ở Hà Nội","Trường học ở Đà Nẵng"],a:0,e:"the hotel project in Nha Trang."},
  {t:"dlg",lines:DLG_LONG,q:"Phần điện đã làm được bao nhiêu?",o:["Khoảng 90% dây cáp","Khoảng 50%","Đã xong 100%","Chưa bắt đầu"],a:0,e:"about ninety percent of the cables."},
  {t:"dlg",lines:DLG_LONG,q:"Vấn đề chính là gì?",o:["Chiller về trễ 2 tuần","Thiếu công nhân","Khách đổi thiết kế","Hết ngân sách"],a:0,e:"the chillers … will be two weeks late."},

  {t:"dlg",lines:DLG_LONG,q:"Vì sao người A muốn trả thêm tiền?",o:["Chờ thì sẽ bị khách phạt chậm tiến độ","Hàng của nhà cung cấp mới tốt hơn","Nhà cung cấp cũ đóng cửa","Khách yêu cầu đổi nhà cung cấp"],a:0,e:"If we wait, we will pay a penalty to the client."},
  {t:"dlg",lines:DLG_LONG,q:"Chiều nay người B sẽ làm gì?",o:["Gửi báo giá của nhà cung cấp mới","Gọi cho khách hàng","Đi công trường","Ký hợp đồng"],a:0,e:"I'll send you their quotation this afternoon."},

/* Giọng đọc Claude + micro nhận diện (nếu môi trường hỗ trợ) */
const CAP={tts:null,dict:null,ai:null,aiErr:""};
/* Micro dự phòng khi chạy ngoài Claude: Web Speech API của trình duyệt (Chrome/Edge/Safari mới) */
function webSpeechAdapter(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
  let rec=null;const h={p:[],f:[],s:[]};const emit=(a,x)=>a.forEach(fn=>{try{fn(x)}catch(e){}});
  return{
    start(){return new Promise((res,rej)=>{try{
      rec=new SR();rec.lang="en-US";rec.interimResults=true;rec.continuous=true;
      rec.onstart=()=>{emit(h.s,{state:"listening"});res()};
      rec.onresult=e=>{let it="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)emit(h.f,{text:r[0].transcript.trim()});else it+=r[0].transcript}emit(h.p,{text:it.trim()})};
      rec.onerror=ev=>{const c=(ev.error==="not-allowed"||ev.error==="service-not-allowed")?"not_granted":ev.error;rej({code:c})};
      rec.onend=()=>emit(h.s,{state:"idle",reason:"stopped"});
      rec.start()}catch(e){rej({code:"error"})}})},
    stop(){try{rec&&rec.stop()}catch(e){}return Promise.resolve()},
    onPartial(f){h.p.push(f)},onFinal(f){h.f.push(f)},onState(f){h.s.push(f)}
  };
}
async function initCaps(){
  if(!(window.claude&&window.claude.use)){store.web=true;CAP.dict=webSpeechAdapter();
    if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost"))navigator.serviceWorker.register("sw.js").catch(()=>{});
    if(view.name==="home")render();return}
  try{CAP.tts=await window.claude.use("tts")}catch(e){CAP.tts=null}
  try{CAP.dict=await window.claude.use("dictation")}catch(e){CAP.dict=null}
  try{CAP.ai=await window.claude.use("sample")}catch(e){CAP.ai=null}
  if(["speak","spk","listen","tutor","quiz"].includes(view.name))render();
}

function norm(s){
  s=String(s).toLowerCase().replace(/[’‘`]/g,"'");
  const m={"i'm":"i am","you're":"you are","he's":"he is","she's":"she is","it's":"it is","we're":"we are","they're":"they are","isn't":"is not","aren't":"are not","don't":"do not","doesn't":"does not","can't":"cannot","i'll":"i will","you'll":"you will","he'll":"he will","she'll":"she will","we'll":"we will","they'll":"they will","it'll":"it will","won't":"will not","didn't":"did not","wasn't":"was not","weren't":"were not","i'd":"i would","we'd":"we would","you'd":"you would","haven't":"have not","hasn't":"has not","couldn't":"could not","wouldn't":"would not","who's":"who is","where's":"where is","how's":"how is","that's":"that is","what's":"what is","there's":"there is","let's":"let us"};
  s=s.replace(/[a-z]+'[a-z]+/g,w=>m[w]||w);
  return s.replace(/-/g," ").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
}

/* ---------- TEXT-TO-SPEECH (trình duyệt) ---------- */
const TTS={ok:"speechSynthesis" in window,voice:null};
function pickVoice(){if(!TTS.ok)return;const vs=speechSynthesis.getVoices();TTS.voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}
if(TTS.ok){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
const clampRate=r=>Math.max(0.7,Math.min(1.5,r));
function canSpeak(){return !!CAP.tts||TTS.ok}
function browserSpeak(lines,rate){
  if(!TTS.ok){toast("Thiết bị này không hỗ trợ đọc tiếng Anh.");return}
  try{speechSynthesis.cancel();
    const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    lines.forEach(([sp,t])=>{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";
      const v=sp==="B"?(vs.find(x=>x!==TTS.voice&&/en[-_]US/i.test(x.lang))||TTS.voice):TTS.voice;if(v)u.voice=v;
      if(sp==="B"&&v===TTS.voice)u.pitch=1.35;u.rate=rate*0.95;speechSynthesis.speak(u)})}
  catch(e){toast("Không phát được âm thanh trên thiết bị này.")}
}
function speakLines(lines,rate){
  rate=rate||S.rate||1;
  if(CAP.tts){
    const r=clampRate(rate);
    CAP.tts.speak(lines.map(([sp,t])=>({text:t,voice:sp==="B"?"airy":"buttery",language:"en",rate:r}))).catch(e=>{
      const c=e&&e.code;if(c==="not_granted"||c==="unavailable"||c==="unsupported"){CAP.tts=null;browserSpeak(lines,rate)}
      else if(c==="rate_limited")toast("Giọng đọc đang bận, thử lại sau vài giây.")});

  }

}

/* ---------- PROGRESS LOGIC ---------- */
const lessonsOf=l=>LESSONS.filter(x=>x.level===l);
const isDone=id=>!!(S.lessons[id]&&S.lessons[id].done);
function isUnlocked(les){
  const idx=LESSONS.indexOf(les);
  if(idx===0)return true;
  if(S.placement&&S.placement.level>=les.level)return true;
  return isDone(LESSONS[idx-1].id);
}
function nextLesson(){
  if(S.last){const l=LESSONS.find(x=>x.id===S.last);if(l&&!isDone(l.id)&&isUnlocked(l))return l}
  return LESSONS.find(l=>isUnlocked(l)&&!isDone(l.id))||null;
}
function currentLevel(){const n=nextLesson();if(n)return n.level;return Math.max(...LESSONS.map(l=>l.level))}
const levelPct=l=>{const ls=lessonsOf(l);if(!ls.length)return 0;return Math.round(ls.filter(x=>isDone(x.id)).length/ls.length*100)};
const totalPct=()=>Math.round(LESSONS.filter(l=>isDone(l.id)).length/LESSONS.length*100);
function streak(){
  let n=0;const d=new Date();
  const key=x=>x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0");
  if(!S.days[key(d)])d.setDate(d.getDate()-1);
  while(S.days[key(d)]){n++;d.setDate(d.getDate()-1)}
  return n;
}
const studyDays=()=>Object.values(S.days).filter(v=>v>0).length;
const minsToday=()=>Math.floor((S.days[today()]||0)/60);

let Q=null;
const TYPE_LBL={mcq:"Trắc nghiệm",fill:"Điền từ",order:"Sắp xếp thành câu",tr:"Dịch câu",listen:"Nghe và chọn đáp án",dict:"Nghe và gõ lại",dlg:"Nghe hội thoại",reflex:"Phản xạ nghe – đáp",write:"Viết"};
const typeLbl=it=>it.lbl||(it.text?"Đọc hiểu":null)||(it.t==="dict"&&it.q?"Nghe và điền từ còn thiếu":TYPE_LBL[it.t]);
function getEx(id,i){const src=LESSONS.find(x=>x.id===id)||LISTEN.find(x=>x.id===id);return src&&src.exs[+i]?src.exs[+i]:null}
function srcTitle(id){const s=LESSONS.find(x=>x.id===id)||LISTEN.find(x=>x.id===id);return s?s.title:id}
function prep(ex,src){
  const it=Object.assign({},ex,{src});
  if(ex.o){it.ord=shuffle(ex.o.map((_,i)=>i))}
  if(ex.t==="order"){const words=ex.a.replace(/[.?!]$/,"").split(" ").concat(ex.x||[]);it.words=shuffle(words.map((w,i)=>({w,i})));it.pick=[]}
  return it;
}
function startQuiz(kind,id){
  let items=[];
  if(kind==="lesson"){const l=LESSONS.find(x=>x.id===id);items=l.exs.map((e,i)=>prep(e,{l:l.id,i}))}
  else if(kind==="listen"){const l=LISTEN.find(x=>x.id===id);items=l.exs.map((e,i)=>prep(e,{l:l.id,i}))}
  else if(kind==="placement"){items=PLACEMENT.map((e,i)=>prep(e,{p:i}))}
  else if(kind==="quick"){items=quickItems();if(!items.length){toast("Chưa có bài tập để học nhanh.");return}}
  else if(kind==="review"){

function check(){
  const it=Q.items[Q.i];let ok=false,given="";
  if(it.t==="mcq"||it.t==="listen"||it.t==="dlg"||it.t==="reflex"){ok=Q.sel===it.a;given=Q.sel===-1?"(hết giờ)":it.o[Q.sel]}
  else if(it.t==="write"){given=Q.sel||"";const words=wcount(given);const res=it.must.map(m=>new RegExp(m[1],"i").test(given));ok=words>=it.min&&res.every(Boolean);Q.ans[Q.i]={ok,given,words,res}}
  else if(it.t==="fill"||it.t==="tr"||it.t==="dict"){given=Q.sel||"";ok=it.digits?given.replace(/\D/g,"")===it.a[0]:it.a.some(a=>norm(a)===norm(given))}
  else if(it.t==="order"){given=it.pick.map(wi=>it.words[wi].w).join(" ");ok=norm(given)===norm(it.a)}
  if(it.t!=="write")Q.ans[Q.i]={ok,given};Q.checked=true;clearInterval(Q.tm);
  if(Q.kind!=="placement"&&it.src&&it.src.l){
    const k="e:"+it.src.l+"#"+it.src.i;
    if(!ok)srsGrade(k,0);
    else if((Q.kind==="review"||Q.kind==="quick")&&S.srs[k])srsGrade(k,2);
    tally(skillOf(it),ok);if(ok)award(10);if(ok&&it.t==="write")bump("writeOk");
  }
  try{navigator.vibrate&&navigator.vibrate(ok?15:[30,50,30])}catch(e){}
  markActive();save();render();
}

    r.attempts++;r.best=Math.max(r.best,pct);if(pct>=PASS)r.done=true;r.lastDate=today();S.lessons[Q.id]=r;
    S.tests.push({id:Q.id,score:pct,date:today()});

  }else if(Q.kind==="listen"){
    const r=S.listen[Q.id]||{best:0,attempts:0};if(pct>=PASS&&r.best<PASS)award(30);r.attempts++;r.best=Math.max(r.best,pct);r.lastDate=today();S.listen[Q.id]=r;
    S.tests.push({id:Q.id,score:pct,date:today()});

}

// grade: 0 Quên, 1 Khó, 2 Nhớ, 3 Dễ
function srsGrade(key,g){
  const c=S.srs[key]||{ease:2.5,int:0,reps:0,lapses:0};
  if(g===0){c.reps=0;c.int=0;c.lapses=(c.lapses||0)+1;c.ease=Math.max(1.3,c.ease-0.2)}
  else if(g===1){c.int=Math.max(1,Math.round((c.int||1)*1.2));c.ease=Math.max(1.3,c.ease-0.15);c.reps++}
  else{c.int=c.reps===0?1:c.reps===1?3:Math.round(c.int*c.ease);if(g===3){c.int=Math.round(c.int*1.3)+1;c.ease+=0.15}c.reps++}
  c.due=addDays(today(),c.int);c.last=g;S.srs[key]=c;
}
function nextIntLabel(key,g){const c=Object.assign({ease:2.5,int:0,reps:0},S.srs[key]||{});let i;
  if(g===0)i=0;else if(g===1)i=Math.max(1,Math.round((c.int||1)*1.2));else{i=c.reps===0?1:c.reps===1?3:Math.round(c.int*c.ease);if(g===3)i=Math.round(i*1.3)+1}
  return i===0?"ôn lại ngay":i+" ngày"}
function srsStatus(key){const c=S.srs[key];if(!c)return"new";if(c.int===0)return"weak";if(c.int>=21)return"known";return"review"}
const ST_LBL={new:["Từ mới","gray"],weak:["Chưa nhớ","warn"],review:["Cần ôn lại",""],known:["Đã thuộc","ok"]};
function dueKeys(prefix){const t=today();return Object.keys(S.srs).filter(k=>k.startsWith(prefix+":")&&S.srs[k].due<=t).sort((a,b)=>S.srs[a].due<S.srs[b].due?-1:1)}

async function sendTutor(text){
  text=(text||"").trim();if(!text||T.busy||!CAP.ai)return;
  if(text.length>1500)text=text.slice(0,1500);
  const mode=T.mode;const hist=chatOf(mode);
  hist.push({role:"user",content:text});T.draft="";
  const win=hist.slice(-12);while(win.length&&win[0].role!=="user")win.shift();
  const input=win.map((m,i)=>({role:m.role,content:i===0?tutorSystem(mode)+"\n\n=== TIN NHẮN CỦA HỌC VIÊN ===\n"+m.content:m.content}));
  T.busy=true;T.stream="";T.abort=new AbortController();markActive();render();
  try{
    const r=await CAP.ai(input,{cache:false,signal:T.abort.signal,onText:({text})=>{T.stream=text;const el=$("#streamBub");if(el){el.innerHTML=mdLite(text);const bx=$("#chatBox");if(bx)bx.scrollTop=bx.scrollHeight}}});
    hist.push({role:"assistant",content:(r&&r.text)||T.stream||"(không có phản hồi)"});bump("tutor");award(3);
  }catch(e){
    const c=e&&e.code;
    if(c==="not_granted"){CAP.ai=null;CAP.aiErr="Bạn chưa cho phép ứng dụng dùng AI.";}
    else if(c==="rate_limited")toast("Gia sư AI đang quá tải, thử lại sau ít phút.");
    else if(T.stream)hist.push({role:"assistant",content:T.stream+" …(đã dừng)"});
    else if(!(T.abort&&T.abort.signal.aborted))toast("Chưa nhận được phản hồi từ AI, thử lại.");
    if(!T.stream&&c!=="not_granted")hist.pop();
  }
  while(hist.length>20)hist.shift();
  hist.forEach(m=>{if(m.content.length>2500)m.content=m.content.slice(0,2500)});
  T.busy=false;T.abort=null;T.stream="";save();if(view.name==="tutor")render();
}

const SP={state:"idle",text:"",partial:"",active:false,result:null};
function hookDictation(){
  if(!CAP.dict||hookDictation.done)return;hookDictation.done=true;
  const live=()=>{const el=document.getElementById("spLive");if(el)el.textContent=(SP.text+" "+SP.partial).trim()||"…"};
  try{
    CAP.dict.onPartial(({text})=>{SP.partial=text||"";live()});
    CAP.dict.onFinal(({text})=>{if(text)SP.text=(SP.text+" "+text).trim();SP.partial="";live()});
    CAP.dict.onState(({state})=>{SP.state=state;if(state==="idle"&&SP.active){SP.active=false;evalSpeech()}if(state==="idle"&&T.mic)tutorMicDone();if(view.name==="spk"||view.name==="tutor")render()});
  }catch(e){}

function wordTip(w){
  if(/th/.test(w))return"“th”: đặt đầu lưỡi giữa hai hàm răng rồi đẩy hơi.";
  if(/sh/.test(w))return"/ʃ/: chu môi, đẩy hơi như “suỵt”.";
  if(/ch$/.test(w))return"Âm cuối /tʃ/: bật nhẹ “ch” ở cuối, đừng nuốt.";
  if(/(s|es)$/.test(w)&&w.length>2)return"Bật âm cuối /s/ hoặc /z/ – đừng nuốt.";
  if(/[tdkpgb]$/.test(w))return"Bật nhẹ âm cuối, không nuốt mất.";
  if(/ee|ea/.test(w))return"Kéo dài âm /iː/.";
  return"Nghe mẫu tốc độ chậm rồi đọc riêng từ này 3 lần.";
}
function evalSpeech(){
  const s=SPEAK.find(x=>x.id===view.id).s[view.i];
  const target=norm(s[0]).split(" ");
  const heardArr=norm(SP.text+" "+SP.partial).split(" ").filter(Boolean);
  const pool={};heardArr.forEach(w=>pool[w]=(pool[w]||0)+1);
  const marks=target.map(w=>{if(pool[w]){pool[w]--;return[w,true]}return[w,false]});
  const pct=heardArr.length?Math.round(marks.filter(m=>m[1]).length/target.length*100):0;
  SP.result={marks,pct,heard:(SP.text+" "+SP.partial).trim()};
  if(heardArr.length){const k=view.id+"#"+view.i;S.speak[k]=Math.max(S.speak[k]||0,pct);if(pct>=PASS)award(5);markActive();save()}
}

function tally(skill,ok){S.ts=S.ts||{};const t=S.ts[skill]||(S.ts[skill]={c:0,n:0});t.n++;if(ok)t.c++}

let badgeQueue=[];
function checkBadges(){
  if(!S.profile)return;S.badges=S.badges||{};const fresh=[];
  BADGES.forEach(b=>{if(!S.badges[b.id]){let ok=false;try{ok=b.test()}catch(e){}if(ok){S.badges[b.id]=today();fresh.push(b)}}});
  if(fresh.length&&!S._silentBadges){badgeQueue.push(...fresh);showBadge()}
}
function showBadge(){
  if(document.getElementById("badgePop")||!badgeQueue.length)return;
  const b=badgeQueue.shift();const d=document.createElement("div");d.id="badgePop";d.className="badgepop";
  d.innerHTML=`<div style="font-size:2rem">${b.ic}</div><div><div class="xs" style="opacity:.85">Huy hiệu mới!</div><b>${esc(b.name)}</b><div class="xs" style="opacity:.85">${esc(b.desc)}</div></div>`;
  d.onclick=()=>{d.remove();showBadge()};document.body.appendChild(d);try{navigator.vibrate&&navigator.vibrate([20,40,20])}catch(e){}
  setTimeout(()=>{if(d.parentNode){d.remove();showBadge()}},3800);
}
function initXP(){ // lần đầu: tính XP từ tiến độ đã có, không bật thông báo
  if(S.xp!==undefined)return;
  let x=0;Object.values(S.lessons).forEach(r=>{if(r.done)x+=50;x+=Math.round((r.best||0)/10)*5});
  Object.values(S.listen||{}).forEach(r=>x+=Math.round((r.best||0)/10)*3);
  x+=Object.keys(S.srs).filter(k=>k.startsWith("v:")).length*2;
  S.xp=x;S._silentBadges=true;checkBadges();S._silentBadges=false;
}

let statPeriod="week";
const dkey=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function periodRange(p,offset){const days=p==="week"?7:30;const out=[];for(let i=days*(offset+1)-1;i>=days*offset;i--){const d=new Date();d.setDate(d.getDate()-i);out.push(dkey(d))}return out}
function periodSum(keys){const set=new Set(keys);
  const mins=Math.floor(keys.reduce((a,k)=>a+(S.days[k]||0),0)/60);
  const xp=keys.reduce((a,k)=>a+((S.xpDays||{})[k]||0),0);
  const tests=S.tests.filter(t=>set.has(t.date)&&t.id!=="placement");
  const avg=tests.length?Math.round(tests.reduce((a,t)=>a+t.score,0)/tests.length):null;
  const active=keys.filter(k=>S.days[k]>0).length;
  return{mins,xp,tests:tests.length,avg,active}}
function delta(a,b,suf){if(a==null||b==null)return"";const d=a-b;if(!d)return`<span class="xs muted">= kỳ trước</span>`;return`<span class="xs" style="color:${d>0?"var(--ok)":"var(--bad)"}">${d>0?"▲":"▼"} ${Math.abs(d)}${suf||""}</span>`}

  const tips={vocab:["Ôn thẻ từ vựng mỗi ngày","review"],grammar:["Xem lại phần Ngữ pháp và làm lại bài dưới 80%","grammar"],listen:["Luyện các bài nghe ở tốc độ chậm rồi bình thường","listen"],speak:["Luyện nói chủ đề âm cuối và âm th","speak"],read:["Làm lại bài Đọc hiểu (Cấp 4)","roadmap"],write:["Nhờ Gia sư AI sửa câu bạn viết","tutor"]};

   <div class="grid g4" style="margin-top:12px">
    <div class="stat"><b>${cur.mins}</b><span>phút học</span><div>${delta(cur.mins,prev.mins," phút")}</div></div>

/* ---- Học nhanh 5 phút ---- */
function quickItems(){
  const due=dueKeys("e").slice(0,4).map(k=>{const [lid,i]=k.slice(2).split("#");const ex=getEx(lid,i);return ex?prep(ex,{l:lid,i:+i}):null}).filter(Boolean);
  const pool=[];LESSONS.filter(l=>isUnlocked(l)).forEach(l=>l.exs.forEach((e,i)=>{if(e.t!=="write")pool.push([l.id,i,e])}));
  const pick=shuffle(pool).filter(([lid,i])=>!due.some(d=>d.src.l===lid&&d.src.i===i)).slice(0,8-due.length).map(([lid,i,e])=>prep(e,{l:lid,i}));
  return shuffle(due.concat(pick));
}

  const q=$("#admQ");if(q){let t;q.oninput=()=>{clearTimeout(t);t=setTimeout(()=>{ADM.q=q.value;const p=q.selectionStart;render();const n=$("#admQ");n.focus();n.setSelectionRange(p,p)},250)}}
  const r=$("#admReload");if(r)r.onclick=()=>{ADM.rows=null;render()};
  const c=$("#admCsv");if(c)c.onclick=()=>{
    const head=["Họ tên","Email","Điện thoại","Địa chỉ","Ngày đăng ký","Hoạt động gần nhất","Cấp độ","Bài đã xong","XP"];
    const cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
    const lines=[head.map(cell).join(",")].concat(ADM.rows.map(r=>[r.full_name,r.email,"'"+r.phone,r.address,fmtD(r.created_at),fmtD(r.last_seen_at),r.current_level??0,r.lessons_done??0,r.xp??0].map(cell).join(",")));
    const blob=new Blob(["﻿"+lines.join("\r\n")],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="hoc-vien-english-start-pro-"+today()+".csv";document.body.appendChild(a);a.click();a.remove();
  };
}
